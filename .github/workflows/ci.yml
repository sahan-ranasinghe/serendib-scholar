name: CI

# Every push and PR: types, lint, unit tests, the lesson dry-run's
# assertions, and a dependency vulnerability audit. Pair this with branch
# protection on master (see docs/SECURITY.md) so a red run blocks merging.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npx eslint src scripts

      - name: Unit tests
        run: |
          npx tsx --test \
            src/lib/lessonOrchestrator.test.ts \
            src/lib/timeStretch.test.ts \
            src/lib/sinhalaNumber.test.ts \
            src/lib/scriptDistance.test.ts \
            src/lib/addressToken.test.ts \
            src/lib/boardContentParser.test.ts \
            src/lib/pageReferenceDetection.test.ts \
            src/lib/singleFire.test.ts \
            scripts/ingest-syllabus.test.ts \
            scripts/lib/geminiRetry.test.ts

      # The dry run rebuilds the lesson from content_bank and walks its
      # assertions — it needs read access to the database. Add these two
      # repository secrets (Settings → Secrets and variables → Actions):
      #   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
      # Without them this step SKIPS (visibly) rather than failing every
      # fork/PR that can't see secrets.
      - name: Lesson dry-run assertions
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::warning::Supabase secrets not configured — dry-run assertions SKIPPED"
            exit 0
          fi
          npx tsx scripts/dry-run-lesson.ts

      # GATE (docs/qa/session1-triage.md): the Batch 3 coverage ledger —
      # every blank on every board is asked, demonstrated, or deferred by an
      # explicit rule; the dry run above exits 1 on any "NOT COVERED". This
      # step re-states it so the gate is visible on its own line.
      - name: Coverage ledger (no NOT COVERED)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::warning::Supabase secrets not configured — coverage ledger SKIPPED"
            exit 0
          fi
          npx tsx scripts/dry-run-lesson.ts > dry-run.log 2>&1 || { tail -40 dry-run.log; exit 1; }
          grep -E "^\s*ledger:" dry-run.log || true
          if grep -q "NOT COVERED" dry-run.log; then
            grep "NOT COVERED" dry-run.log
            echo "::error::coverage ledger has NOT COVERED rows"
            exit 1
          fi

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

  # GATE (docs/qa/session1-triage.md, cluster H): the dead-control crawler.
  # Builds the app, starts it with the stub onboarding, and clicks every
  # tappable element on every route, sheet and dialog; one control that does
  # nothing fails the run. Needs the Supabase secrets and the ACCESS_CODE
  # (Settings → Secrets and variables → Actions); skips visibly without them.
  crawl:
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Build, start and crawl
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          CLIP_RENDER: "off"
          DEV_ONBOARDING: stub
          DEV_MODE: "on"
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$ACCESS_CODE" ]; then
            echo "::warning::Supabase/ACCESS_CODE secrets not configured — crawl:check SKIPPED"
            exit 0
          fi
          printf 'ACCESS_CODE=%s\n' "$ACCESS_CODE" > .env.local
          npx next build
          npx next start -p 3001 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3001/offline > /dev/null && break; sleep 1; done
          npx tsx scripts/crawl-check.ts http://localhost:3001
