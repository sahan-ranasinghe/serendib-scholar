<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg width="{{ w }}" height="{{ h }}" viewBox="{{ vb }}" style="display:block;overflow:visible;flex:none"><sc-for list="{{ glyphs }}" as="g" hint-placeholder-count="1"><path d="{{ g.d }}" transform="{{ g.t }}" fill="none" stroke="{{ color }}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></sc-for></svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:60},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5421&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;px&quot;,&quot;min&quot;:16,&quot;max&quot;:120},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2F5FA6&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2F5FA6&quot;,&quot;#3C8C5A&quot;,&quot;#1B1B1B&quot;,&quot;#E9B44C&quot;]}}">
class Component extends DCLogic {
  // Stand-in for the existing hand-stroke numeral SVG set: one path per glyph on a 24×40 grid.
  static G = {
    '0':'M12 3c-5 0-7 8-7 17s2 17 7 17 7-8 7-17-2-17-7-17z',
    '1':'M6 10l7-7v34',
    '2':'M5 10c0-9 14-9 14 0 0 6-12 14-14 27h15',
    '3':'M5 6c6-5 14-3 14 4 0 5-5 7-8 7 4 0 9 2 9 8 0 8-10 10-15 5',
    '4':'M16 37V3L4 26h17',
    '5':'M18 3H7l-2 15c8-4 15 0 15 8 0 9-10 12-15 6',
    '6':'M17 4c-8 2-12 10-12 22 0 12 14 12 14 2 0-8-11-9-14-2',
    '7':'M4 3h16L9 37',
    '8':'M12 19c-5 0-7-3-7-8s3-8 7-8 7 3 7 8-2 8-7 8-8 3-8 9 3 9 8 9 8-3 8-9-3-9-8-9z',
    '9':'M7 36c8-2 12-10 12-22 0-12-14-12-14-2 0 8 11 9 14 2',
    '+':'M12 11v18M3 20h18', '=':'M3 15h18M3 25h18', '-':'M3 20h18', '.':'M12 36l1 1', ',':'M13 34l-3 6', ':':'M12 14v1M12 28v1', '/':'M18 4L6 38',
  };
  renderVals() {
    const v = String(this.props.value ?? ''), size = Number(this.props.size ?? 40), color = this.props.color ?? '#2F5FA6';
    let x = 0; const glyphs = [];
    for (const ch of v) {
      if (ch === ' ') { x += 12; continue; }
      const d = Component.G[ch]; if (!d) { x += 24; continue; }
      glyphs.push({ d, t: `translate(${x} 0)` }); x += 28;
    }
    const W = Math.max(x - 4, 4);
    return { glyphs, color, vb: `0 0 ${W} 42`, w: W * size / 42, h: size };
  }
}
</script>
</body>
</html>
