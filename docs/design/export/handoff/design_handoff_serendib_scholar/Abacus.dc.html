<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="./tokens.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@400;700&family=Yaldevi:wght@400;600&display=swap"></helmet>
<div style="display:flex;align-items:flex-start;gap:16px;flex:none">
  <div style="width:{{ w }}px;flex:none">
    <svg viewBox="0 0 320 170" width="{{ w }}" style="display:block;overflow:visible">
      <sc-for list="{{ rods }}" as="r" hint-placeholder-count="4">
        <g opacity="{{ r.op }}">
          <rect x="{{ r.gx }}" y="6" width="58" height="150" rx="14" fill="{{ r.glowFill }}" stroke="{{ r.glowStroke }}" stroke-width="3"></rect>
          <line x1="{{ r.x }}" y1="18" x2="{{ r.x }}" y2="146" stroke="#6B4528" stroke-width="4" stroke-linecap="round"></line>
          <sc-for list="{{ r.beads }}" as="b" hint-placeholder-count="0">
            <ellipse cx="{{ r.x }}" cy="{{ b.cy }}" rx="19" ry="7" fill="{{ r.color }}" stroke="rgba(27,27,27,.18)" stroke-width="1.5"></ellipse>
          </sc-for>
        </g>
      </sc-for>
      <sc-if value="{{ falling }}" hint-placeholder-val="{{ false }}">
        <ellipse cx="55" cy="26" rx="19" ry="7" fill="#E05263" stroke="rgba(27,27,27,.18)" stroke-width="1.5" style="filter:drop-shadow(0 6px 4px rgba(27,27,27,.25))"></ellipse>
      </sc-if>
      <sc-if value="{{ drag }}" hint-placeholder-val="{{ false }}">
        <ellipse cx="292" cy="42" rx="21" ry="8" fill="#4A7BD0" stroke="rgba(27,27,27,.18)" stroke-width="1.5" style="filter:drop-shadow(0 14px 10px rgba(27,27,27,.3))"></ellipse>
      </sc-if>
      <rect x="8" y="146" width="304" height="20" rx="6" fill="#8B5E3C"></rect>
      <rect x="8" y="160" width="304" height="6" rx="3" fill="#6B4528"></rect>
    </svg>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font:600 20px/1.5 var(--font-label);color:var(--color-ink-70)">
      <sc-for list="{{ rods }}" as="r" hint-placeholder-count="4"><div style="opacity:{{ r.op }}">{{ r.label }}</div></sc-for>
    </div>
    <sc-if value="{{ hasNumber }}" hint-placeholder-val="{{ false }}">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;margin-top:4px">
        <sc-for list="{{ rods }}" as="r" hint-placeholder-count="4"><div style="height:40px;display:flex;align-items:center"><dc-import name="StrokeNum" value="{{ r.digit }}" size="40" color="{{ numberColor }}" hint-size="24px,40px"></dc-import></div></sc-for>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ tray }}" hint-placeholder-val="{{ false }}">
    <div style="width:72px;padding:10px 8px;background:var(--color-paper);border:2px solid var(--color-ink-18);border-radius:12px;box-shadow:var(--shadow-paper);display:grid;gap:8px;justify-items:center;flex:none">
      <div style="width:38px;height:14px;border-radius:50%;background:#E05263;border:1.5px solid rgba(27,27,27,.18)"></div>
      <div style="width:38px;height:14px;border-radius:50%;background:#E05263;border:1.5px solid rgba(27,27,27,.18)"></div>
      <div style="width:38px;height:14px;border-radius:50%;background:#F2A541;border:1.5px solid rgba(27,27,27,.18)"></div>
      <div style="width:38px;height:14px;border-radius:50%;background:#3F8F5F;border:1.5px solid rgba(27,27,27,.18)"></div>
      <div style="width:38px;height:14px;border-radius:50%;background:#4A7BD0;border:1.5px solid rgba(27,27,27,.18)"></div>
      <div style="font:600 16px/1.5 var(--font-label);color:var(--color-ink-70)">පබළු</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:300},&quot;digits&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5421&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Beads&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:-1,&quot;min&quot;:-1,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;State&quot;},&quot;number&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;},&quot;numberColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2F5FA6&quot;,&quot;options&quot;:[&quot;#2F5FA6&quot;,&quot;#3C8C5A&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;},&quot;falling&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;drag&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;tray&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;State&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:280,&quot;min&quot;:160,&quot;max&quot;:480,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const digits = String(p.digits ?? '0000').padStart(4, '0').slice(-4);
    const number = String(p.number ?? '');
    const glow = Number(p.glow ?? -1);
    const colors = ['#E05263', '#F2A541', '#3F8F5F', '#4A7BD0'], labels = ['1000', '100', '10', '1'];
    const rods = [0, 1, 2, 3].map(i => {
      const n = Number(digits[i]) || 0, x = 55 + i * 70;
      const beads = Array.from({ length: n }, (_, k) => ({ cy: 138 - k * 13 }));
      const isGlow = glow === i;
      return { x, gx: x - 29, color: colors[i], label: labels[i], beads, op: glow >= 0 && !isGlow ? 0.38 : 1,
        glowFill: isGlow ? '#FBEFD3' : 'none', glowStroke: isGlow ? '#E9B44C' : 'none',
        digit: number[i] && number[i] !== '_' ? number[i] : '' };
    });
    return { rods, w: Number(p.width ?? 280), falling: !!p.falling, drag: !!p.drag, tray: !!p.tray,
      hasNumber: number.length > 0, numberColor: p.numberColor ?? '#2F5FA6' };
  }
}
</script>
</body>
</html>
